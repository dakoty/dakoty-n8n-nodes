# CI for dakoty-n8n-nodes (lint, tests, build).
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generated files are up to date
        run: |
          npm run generate
          git diff --exit-code

      - name: Lint (n8n-node lint, strict mode)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
