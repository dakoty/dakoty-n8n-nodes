# Proposed .github/workflows/publish.yml - to be added by a maintainer (agents do not edit workflows).
# Based on the workflow generated by `npm create @n8n/node` (n8n requires npm provenance from GitHub Actions).
#
# One-time setup (see docs/RELEASING.md):
#   Option A - trusted publishing (no secret): npmjs.com -> package -> Settings -> Trusted Publisher ->
#     GitHub Actions, owner "dakoty", repository "dakoty-n8n-nodes", workflow "publish.yml". Leave NPM_TOKEN unset.
#   Option B - first release or fallback: add the repository secret NPM_TOKEN (granular token, publish
#     rights, only for the package n8n-nodes-dakoty).
#
# Release: run `npm run release` locally (lint, build, version bump, changelog, tag, push). The tag
# "x.y.z" triggers this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # OIDC token for the npm provenance attestation
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
