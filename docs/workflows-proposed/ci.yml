# Proposed .github/workflows/ci.yml - to be added by a maintainer (agents do not edit workflows).
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generated files are up to date
        run: |
          npm run generate
          git diff --exit-code

      - name: Lint (n8n-node lint, strict mode)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
