components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dk_live_…
      description: "API key created in Dakoty under Settings → Integrations. Send it as `Authorization: Bearer dk_live_…`."
      x-sk-description: "API kľúč vytvorený v Dakoty v Nastavenia → Integrácie. Posielajte ho ako `Authorization: Bearer dk_live_…`."
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - sk
        - cs
        - en
      description: "`sk` or `cs` returns error messages in Slovak, anything else in English."
      x-sk-description: "`sk` alebo `cs` vráti chybové hlásenia po slovensky, inak po anglicky."
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 255
      description: "Makes the POST safe to retry: a repeat with the same key and body returns the stored response with `Idempotent-Replayed:\
        \ true`. A different body returns 422 `IDEMPOTENCY_KEY_REUSED`; a repeat while the first call is still running returns\
        \ 409 `IDEMPOTENCY_IN_PROGRESS`."
      x-sk-description: "Umožní bezpečne zopakovať POST: opakovanie s rovnakým kľúčom a telom vráti uloženú odpoveď s hlavičkou\
        \ `Idempotent-Replayed: true`. Iné telo vráti 422 `IDEMPOTENCY_KEY_REUSED`, súbežné opakovanie 409 `IDEMPOTENCY_IN_PROGRESS`."
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Page size (1–100).
      x-sk-description: Veľkosť stránky (1–100).
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from `next_cursor` of the previous page. Valid only with the same filters.
      x-sk-description: Nepriehľadný kurzor z `next_cursor` predchádzajúcej stránky. Platí iba s rovnakými filtrami.
    Sort:
      name: sort
      in: query
      schema:
        type: string
      example: "-created_at"
      description: Sort field, prefix `-` for descending. Allowed fields are listed per endpoint; default `-created_at`.
      x-sk-description: Pole triedenia, predpona `-` = zostupne. Povolené polia sú uvedené pri jednotlivých koncových bodoch;
        predvolene `-created_at`.
    CreatedAfter:
      name: created_after
      in: query
      schema:
        type: string
        format: date-time
      description: Only items created after this instant (RFC 3339). Use for polling new items and dedupe by `id`.
      x-sk-description: Iba položky vytvorené po tomto okamihu (RFC 3339). Na načítanie nových položiek; deduplikujte podľa
        `id`.
    UpdatedSince:
      name: updated_since
      in: query
      schema:
        type: string
        format: date-time
      description: Only items updated since this instant (RFC 3339). Use for incremental sync.
      x-sk-description: Iba položky zmenené od tohto okamihu (RFC 3339). Na inkrementálnu synchronizáciu.
  headers: {}
  responses:
    E400:
      description: Invalid request.
      x-sk-description: Neplatná požiadavka.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_REQUEST
              message: Invalid request.
              detail: null
    E401:
      description: Missing, invalid, expired or revoked API key.
      x-sk-description: Chýbajúci, neplatný, expirovaný alebo zrušený API kľúč.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Missing, invalid, expired or revoked API key.
              detail: null
    E403:
      description: The key lacks the required scope.
      x-sk-description: Kľúč nemá požadovaný scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: The key lacks the required scope.
              detail: null
    E404:
      description: Resource not found.
      x-sk-description: Zdroj sa nenašiel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: Resource not found.
              detail: null
    E409:
      description: Conflict with the current state.
      x-sk-description: Konflikt s aktuálnym stavom.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CONFLICT
              message: Conflict with the current state.
              detail: null
    E422:
      description: Validation failed or the request cannot be processed.
      x-sk-description: Validácia zlyhala alebo požiadavku nemožno spracovať.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: Validation failed or the request cannot be processed.
              detail: null
    E429:
      description: Rate limit exceeded (per key and per organization). Wait `Retry-After` seconds.
      x-sk-description: Prekročený limit požiadaviek (na kľúč aj na organizáciu). Počkajte `Retry-After` sekúnd.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the window resets.
      content:
        application/json:
