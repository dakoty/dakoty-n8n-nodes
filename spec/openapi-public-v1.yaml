# Dakoty Public API (Developer API v1) — OpenAPI 3.1. Source of truth for the developer portal.
# Served at GET /api/v1/openapi/public-v1.yaml|json; routes <-> paths are pinned by openapi_parity_test.go.
openapi: 3.1.0
info:
  title: Dakoty Public API
  version: '2026-10-01'
  summary: Developer API v1 for the Dakoty CRM
  x-sk-summary: Developer API v1 pre Dakoty CRM
  description: "REST API for integrating Dakoty with Make, Zapier, n8n, AI assistants and custom code. Every response is JSON;\
    \ successful single resources are wrapped in `{\"data\": …}`, lists in `{\"data\": […], \"next_cursor\", \"has_more\"\
    }`. Responses carry `X-Dakoty-Api-Version`, `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`. Mutating\
    \ requests accept an `Idempotency-Key`."
  x-sk-description: "REST API na prepojenie Dakoty s Make, Zapier, n8n, AI asistentmi a vlastným kódom. Odpovede sú JSON;\
    \ jednotlivý zdroj je v `{\"data\": …}`, zoznamy v `{\"data\": […], \"next_cursor\", \"has_more\"}`. Odpovede obsahujú\
    \ `X-Dakoty-Api-Version`, `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`. Zápisové požiadavky akceptujú\
    \ `Idempotency-Key`."
  contact:
    name: Dakoty
    url: https://dakoty.com
servers:
- url: https://api.dakoty.com/api/v1/public
  description: Production
security:
- bearerAuth: []
tags:
- name: General
  description: Identity and limits of the current key.
  x-sk-description: Identita a limity aktuálneho kľúča.
- name: REST hooks
  description: Subscribe a target URL to events (Make, Zapier, n8n). Scope `webhooks:manage`.
  x-sk-description: Prihlásenie cieľovej URL na udalosti (Make, Zapier, n8n). Scope `webhooks:manage`.
- name: Products
  description: Product catalog (read-only).
  x-sk-description: Katalóg produktov (iba čítanie).
- name: Orders
  description: E-shop orders.
  x-sk-description: Objednávky e-shopu.
- name: Webhooks
  description: Outgoing events, signed with Standard Webhooks (`webhook-id`, `webhook-timestamp`, `webhook-signature`). Legacy
    `X-Dakoty-Signature` is sent as well.
  x-sk-description: Odchádzajúce udalosti podpísané podľa Standard Webhooks (`webhook-id`, `webhook-timestamp`, `webhook-signature`).
    Posiela sa aj pôvodný `X-Dakoty-Signature`.
- name: Companies
  description: Companies and their contact persons. Scopes `companies:read` / `companies:write`.
  x-sk-description: Firmy a ich kontaktné osoby. Scopy `companies:read` / `companies:write`.
- name: Clients
  description: Clients (companies with a customer relationship). Scopes `clients:read` / `clients:write`.
  x-sk-description: Klienti (firmy so zákazníckym vzťahom). Scopy `clients:read` / `clients:write`.
- name: Leads
  description: Sales leads and deals. Scopes `leads:read` / `leads:write`.
  x-sk-description: Obchodné príležitosti (leady). Scopy `leads:read` / `leads:write`.
- name: Activities
  description: Calendar activities (calls, meetings, to-dos). Scopes `activities:read` / `activities:write`.
  x-sk-description: Aktivity v kalendári (hovory, stretnutia, úlohy). Scopy `activities:read` / `activities:write`.
- name: Tasks
  description: Project tasks. Scopes `tasks:read` / `tasks:write`.
  x-sk-description: Projektové úlohy. Scopy `tasks:read` / `tasks:write`.
- name: Invoices
  description: Invoices (create issues a new invoice). Scopes `invoices:read` / `invoices:write`.
  x-sk-description: Faktúry (vytvorenie vystaví novú faktúru). Scopy `invoices:read` / `invoices:write`.
- name: Bookings
  description: Appointment bookings. Scopes `bookings:read` / `bookings:write`.
  x-sk-description: Rezervácie termínov. Scopy `bookings:read` / `bookings:write`.
- name: Catalogs
  description: Lookup lists for dropdowns and mappings. Read scope of the respective entity.
  x-sk-description: Číselníky pre výbery a mapovanie. Čítací scope príslušnej entity.
paths:
  /me:
    get:
      operationId: getMe
      tags:
      - General
      summary: Current key, organization and limits
      x-sk-summary: Aktuálny kľúč, organizácia a limity
      x-dakoty-scope: none
      description: Needs no scope — any valid key can call it. Use it as the first call to verify a key.
      x-sk-description: Nevyžaduje scope — zavolať ho môže každý platný kľúč. Použite ho ako prvé volanie na overenie kľúča.
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        '200':
          description: The key, its organization and limits.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: "#/components/schemas/Me"
        '401':
          $ref: "#/components/responses/E401"
        '429':
          $ref: "#/components/responses/E429"
  /products:
    get:
      operationId: listProducts
      tags:
      - Products
      summary: List products
      x-sk-summary: Zoznam produktov
      x-dakoty-scope: products:read
      description: Legacy-shaped list (`next_cursor`, optional `total`), kept compatible with existing e-shop integrations.
      x-sk-description: Zoznam v pôvodnom tvare (`next_cursor`, voliteľne `total`) kvôli kompatibilite s existujúcimi e-shop
        integráciami.
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/UpdatedSince"
      - name: include
        in: query
        description: "`stock` adds aggregate stock levels."
        schema:
          type: string
          enum:
          - stock
        x-sk-description: "`stock` pridá agregované zásoby."
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  total:
                    type: integer
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '429':
          $ref: "#/components/responses/E429"
  /products/{uuid}:
    get:
      operationId: getProduct
      tags:
      - Products
      summary: Get a product
      x-sk-summary: Detail produktu
      x-dakoty-scope: products:read
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The product with images, attachments and per-warehouse stock.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
                  stock_levels:
                    type: array
                    items:
                      type: object
                      properties:
                        product_uuid:
                          type: string
                        warehouse_uuid:
                          type: string
                        warehouse_name:
                          type: string
                        on_hand:
                          type: number
                        reserved:
                          type: number
                        available:
                          type: number
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '404':
          $ref: "#/components/responses/E404"
        '429':
          $ref: "#/components/responses/E429"
  /webhooks:
    post:
      operationId: createRestHook
      tags:
      - REST hooks
      summary: Subscribe to events
      x-sk-summary: Prihlásiť odber udalostí
      x-dakoty-scope: webhooks:manage
      description: The key's owner must hold the read scope of every event (e.g. `leads:read` for `lead.created`). The signing
        `secret` is returned once.
      x-sk-description: Kľúč musí mať čítací scope každej udalosti (napr. `leads:read` pre `lead.created`). Podpisový `secret`
        sa vráti iba raz.
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestHookCreate"
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: "#/components/schemas/RestHookCreated"
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '409':
          $ref: "#/components/responses/E409"
        '422':
          $ref: "#/components/responses/E422"
        '429':
          $ref: "#/components/responses/E429"
    get:
      operationId: listRestHooks
      tags:
      - REST hooks
      summary: List REST hooks
      x-sk-summary: Zoznam REST hookov
      x-dakoty-scope: webhooks:manage
      description: Only subscriptions with `source=rest_hook` of this organization; secrets are never returned.
      x-sk-description: Iba odbery typu `rest_hook` tejto organizácie; secret sa nikdy nevracia.
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RestHook"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '429':
          $ref: "#/components/responses/E429"
  /webhooks/events:
    get:
      operationId: listWebhookEvents
      tags:
      - REST hooks
      summary: List available event types
      x-sk-summary: Dostupné typy udalostí
      x-dakoty-scope: webhooks:manage
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        '200':
          description: Event catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventType"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '429':
          $ref: "#/components/responses/E429"
  /webhooks/events/{type}/sample:
    get:
      operationId: getWebhookEventSample
      tags:
      - REST hooks
      summary: Sample payload of an event
      x-sk-summary: Vzorový payload udalosti
      x-dakoty-scope: webhooks:manage
      description: "Static sample envelope (`test: true`) for building Zap/scenario mappings."
      x-sk-description: "Statická vzorová obálka (`test: true`) na tvorbu mapovania v Zape/scenári."
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: type
        in: path
        required: true
        schema:
          type: string
        example: lead.created
      responses:
        '200':
          description: An array with one sample envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookEnvelope"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '404':
          $ref: "#/components/responses/E404"
        '429':
          $ref: "#/components/responses/E429"
  /webhooks/{id}:
    get:
      operationId: getRestHook
      tags:
      - REST hooks
      summary: Get a REST hook
      x-sk-summary: Detail REST hooku
      x-dakoty-scope: webhooks:manage
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: "#/components/schemas/RestHook"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '404':
          $ref: "#/components/responses/E404"
        '429':
          $ref: "#/components/responses/E429"
    delete:
      operationId: deleteRestHook
      tags:
      - REST hooks
      summary: Unsubscribe
      x-sk-summary: Zrušiť odber
      x-dakoty-scope: webhooks:manage
      description: 404 if the subscription does not exist or is not a REST hook.
      x-sk-description: 404, ak odber neexistuje alebo nie je REST hook.
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '404':
          $ref: "#/components/responses/E404"
        '429':
          $ref: "#/components/responses/E429"
  /companies/find:
    get:
      operationId: findCompanies
      tags:
      - Companies
      summary: Find companies
      x-sk-summary: "Nájsť: firmy"
      x-dakoty-scope: companies:read
      description: Exact lookup for dedupe; returns an empty list when nothing matches. At least one query parameter is required.
      x-sk-description: Presné vyhľadanie na deduplikáciu; ak nič nezodpovedá, vráti prázdny zoznam. Vyžaduje aspoň jeden
        parameter.
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: registration_id
        in: query
        description: Registration number (IČO), exact match without spaces.
        schema:
          type: string
        x-sk-description: IČO, presná zhoda bez medzier.
      - name: email
        in: query
        description: E-mail, case-insensitive.
        schema:
          type: string
        x-sk-description: Filter podľa `email`.
      - name: phone
        in: query
        description: Phone number.
        schema:
          type: string
        x-sk-description: Filter podľa `phone`.
      responses:
        '200':
          description: Matching items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '429':
          $ref: "#/components/responses/E429"
  /companies:
    get:
      operationId: listCompanys
      tags:
      - Companies
      summary: List companies
      x-sk-summary: "Zoznam: firmy"
      x-dakoty-scope: companies:read
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_at
          - updated_at
          - name
          - "-created_at"
          - "-updated_at"
          - "-name"
        description: Sort field; prefix `-` for descending. Default `-created_at`.
        x-sk-description: Pole triedenia; predpona `-` = zostupne. Predvolene `-created_at`.
      - $ref: "#/components/parameters/CreatedAfter"
      - $ref: "#/components/parameters/UpdatedSince"
      - name: search
        in: query
        description: Full-text search in name, e-mail and registration number.
        schema:
          type: string
        x-sk-description: Fulltext v názve, e-maile a IČO.
      responses:
        '200':
          description: A page of companies.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - next_cursor
                - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '429':
          $ref: "#/components/responses/E429"
    post:
      operationId: createCompany
      tags:
      - Companies
      summary: Create company
      x-sk-summary: "Vytvoriť: firma"
      x-dakoty-scope: companies:write
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyBody"
      responses:
        '201':
          description: The created company.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: "#/components/schemas/Company"
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '404':
          $ref: "#/components/responses/E404"
        '422':
          $ref: "#/components/responses/E422"
        '429':
          $ref: "#/components/responses/E429"
  /companies/{id}:
    get:
      operationId: getCompany
      tags:
      - Companies
      summary: Get company
      x-sk-summary: "Detail: firma"
      x-dakoty-scope: companies:read
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The company.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: "#/components/schemas/Company"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '404':
          $ref: "#/components/responses/E404"
        '429':
          $ref: "#/components/responses/E429"
    patch:
      operationId: updateCompany
      tags:
      - Companies
      summary: Update company
      x-sk-summary: "Upraviť: firma"
      x-dakoty-scope: companies:write
      description: "Partial update: send only the fields to change; absent fields stay unchanged."
      x-sk-description: "Čiastočná úprava: pošlite iba polia, ktoré sa majú zmeniť; chýbajúce polia ostanú nezmenené."
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyBody"
      responses:
        '200':
          description: The updated company.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: "#/components/schemas/Company"
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '404':
          $ref: "#/components/responses/E404"
        '422':
          $ref: "#/components/responses/E422"
        '429':
          $ref: "#/components/responses/E429"
  /contacts/find:
    get:
      operationId: findContacts
      tags:
      - Companies
      summary: Find contacts
      x-sk-summary: "Nájsť: kontakty"
      x-dakoty-scope: companies:read
      description: Exact lookup for dedupe; returns an empty list when nothing matches. At least one query parameter is required.
      x-sk-description: Presné vyhľadanie na deduplikáciu; ak nič nezodpovedá, vráti prázdny zoznam. Vyžaduje aspoň jeden
        parameter.
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - name: email
        in: query
        description: E-mail, case-insensitive.
        schema:
          type: string
        x-sk-description: Filter podľa `email`.
      - name: phone
        in: query
        description: Phone number.
        schema:
          type: string
        x-sk-description: Filter podľa `phone`.
      responses:
        '200':
          description: Matching items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '429':
          $ref: "#/components/responses/E429"
  /contacts:
    get:
      operationId: listContacts
      tags:
      - Companies
      summary: List contacts
      x-sk-summary: "Zoznam: kontakty"
      x-dakoty-scope: companies:read
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_at
          - updated_at
          - "-created_at"
          - "-updated_at"
        description: Sort field; prefix `-` for descending. Default `-created_at`.
        x-sk-description: Pole triedenia; predpona `-` = zostupne. Predvolene `-created_at`.
      - $ref: "#/components/parameters/CreatedAfter"
      - $ref: "#/components/parameters/UpdatedSince"
      - name: company_id
        in: query
        description: Filter by `company_id` (UUID).
        schema:
          type: string
          format: uuid
        x-sk-description: Filter podľa `company_id` (UUID).
      - name: search
        in: query
        description: Filter by `search`.
        schema:
          type: string
        x-sk-description: Filter podľa `search`.
      responses:
        '200':
          description: A page of contacts.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - next_cursor
                - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
        '403':
          $ref: "#/components/responses/E403"
        '429':
          $ref: "#/components/responses/E429"
    post:
      operationId: createContact
      tags:
      - Companies
      summary: Create contact
      x-sk-summary: "Vytvoriť: kontakt"
      x-dakoty-scope: companies:write
      parameters:
      - $ref: "#/components/parameters/AcceptLanguage"
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactBody"
      responses:
        '201':
          description: The created contact.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: "#/components/schemas/Contact"
        '400':
          $ref: "#/components/responses/E400"
        '401':
          $ref: "#/components/responses/E401"
